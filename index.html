<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RigidBody Lever Lab</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { margin: 0; background: #f0f4f8; font-family: sans-serif; overflow: hidden; }
        #canvas-container { width: 100vw; height: 100vh; }
        .ui { position: absolute; top: 20px; left: 20px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="ui">
        <h3>RigidBody Seesaw</h3>
        <label>Mass Left (kg): </label><input type="range" id="massL" min="1" max="50" value="10"><br>
        <label>Mass Right (kg): </label><input type="range" id="massR" min="1" max="50" value="10"><br>
        <button onclick="resetScene()">Reset Simulation</button>
    </div>
    <div id="canvas-container"></div>

<script>
    const { Engine, Render, Runner, Bodies, Composite, Constraint, Body } = Matter;

    const engine = Engine.create();
    const render = Render.create({
        element: document.getElementById('canvas-container'),
        engine: engine,
        options: { width: window.innerWidth, height: window.innerHeight, wireframes: false, background: '#f0f4f8' }
    });

    let seesaw, pivot;

    function resetScene() {
        Composite.clear(engine.world);
        
        const ground = Bodies.rectangle(window.innerWidth/2, window.innerHeight - 50, window.innerWidth, 100, { isStatic: true });
        const fulcrum = Bodies.trapezoid(window.innerWidth/2, window.innerHeight - 150, 80, 100, 1, { isStatic: true });
        
        seesaw = Bodies.rectangle(window.innerWidth/2, window.innerHeight - 220, 800, 20, { 
            friction: 0.5, restitution: 0.2 
        });

        pivot = Constraint.create({
            pointA: { x: window.innerWidth/2, y: window.innerHeight - 200 },
            bodyB: seesaw,
            stiffness: 1,
            length: 0
        });

        // Add weights as RigidBodies
        const weightL = Bodies.rectangle(window.innerWidth/2 - 300, window.innerHeight - 400, 50, 50, { mass: document.getElementById('massL').value });
        const weightR = Bodies.rectangle(window.innerWidth/2 + 300, window.innerHeight - 400, 50, 50, { mass: document.getElementById('massR').value });

        Composite.add(engine.world, [ground, fulcrum, seesaw, pivot, weightL, weightR]);
    }

    resetScene();
    Render.run(render);
    Runner.run(Runner.create(), engine);
</script>
</body>
</html>
