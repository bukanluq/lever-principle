<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Fix-It Crew: Lever Workshop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            touch-action: pan-y; /* Prevent horizontal swipe navigation on mobile */
            overflow-x: hidden;
        }
        h1, h2, h3, .chunky-text {
            font-family: 'Fredoka One', cursive;
        }
        
        /* The Beam and Tipping Animation */
        #beam-wrapper {
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); /* Bouncy physics feel */
        }
        
        /* Draggable Fulcrum Touch Target */
        #fulcrum-touch-target {
            touch-action: none; /* Crucial for custom touch drag */
        }
        
        /* 3D Button Push Effect */
        .btn-3d {
            transition: all 0.1s;
        }
        .btn-3d:active {
            transform: translateY(4px);
            border-bottom-width: 0px !important;
            margin-top: 4px;
        }

        /* Diagonal stripes for effort zone */
        .stripes {
            background-image: repeating-linear-gradient(
                45deg,
                rgba(255, 255, 255, 0.2),
                rgba(255, 255, 255, 0.2) 10px,
                transparent 10px,
                transparent 20px
            );
        }

        /* Checkered flag styling for goals */
        .scientst-panel {
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col selection:bg-transparent">

    <!-- Game Container -->
    <div id="app" class="flex-1 flex flex-col relative transition-colors duration-500">
        
        <!-- Header -->
        <header class="p-4 flex justify-between items-center bg-white/20 backdrop-blur-md shadow-sm z-20">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-yellow-400 rounded-full flex items-center justify-center text-2xl shadow-md border-2 border-white">
                    🤖
                </div>
                <div>
                    <h1 class="text-xl text-white drop-shadow-md">Fix-It Crew</h1>
                    <p id="theme-name" class="text-sm font-bold text-yellow-300 drop-shadow-sm">Sector 1</p>
                </div>
            </div>
            
            <!-- Scientist Mode Toggle -->
            <div class="flex items-center gap-2 bg-white/30 px-3 py-2 rounded-xl backdrop-blur-sm border border-white/40 shadow-sm">
                <span class="text-white font-bold text-sm">💡 Scientist Mode</span>
                <button id="toggle-scientist" class="w-12 h-6 bg-gray-400 rounded-full relative transition-colors duration-300">
                    <div id="toggle-knob" class="w-5 h-5 bg-white rounded-full absolute top-0.5 left-0.5 transition-transform duration-300 shadow-sm"></div>
                </button>
            </div>
        </header>

        <!-- Mission Briefing -->
        <div class="px-4 mt-6 z-10 max-w-2xl mx-auto w-full">
            <div class="bg-white rounded-2xl p-4 shadow-xl border-4 border-white/50 relative overflow-hidden">
                <div class="absolute -right-4 -top-4 text-6xl opacity-20">📋</div>
                <h2 id="goal-title" class="text-2xl text-gray-800 mb-1 chunky-text">Job 1</h2>
                <p id="goal-text" class="text-gray-600 font-bold text-lg"></p>
            </div>
        </div>

        <!-- Scientist Math Panel (Hidden by default) -->
        <div id="scientist-panel" class="hidden px-4 mt-4 z-10 max-w-2xl mx-auto w-full transition-all">
            <div class="bg-gray-900 rounded-xl p-4 border-4 border-gray-700 scientst-panel text-green-400 font-mono text-sm md:text-base grid grid-cols-2 gap-4">
                <div class="flex flex-col items-center bg-black/40 p-2 rounded-lg">
                    <span class="text-gray-400 mb-1 text-xs uppercase tracking-wider">Load Torque</span>
                    <span id="math-load" class="font-bold text-lg text-fuchsia-400">4 × 3 = 12</span>
                </div>
                <div class="flex flex-col items-center bg-black/40 p-2 rounded-lg">
                    <span class="text-gray-400 mb-1 text-xs uppercase tracking-wider">Effort Torque</span>
                    <span id="math-effort" class="font-bold text-lg text-emerald-400">2 × 4 = 8</span>
                </div>
                <div class="col-span-2 text-center text-xs text-gray-300 border-t border-gray-700 pt-2">
                    Rule: <span class="text-white">Effort Torque</span> must be <span id="math-rule-word" class="text-yellow-400">Equal to</span> <span class="text-white">Load Torque</span>
                </div>
            </div>
        </div>

        <!-- Main Physics Stage -->
        <div class="flex-1 flex flex-col justify-end pb-8 relative mt-12 mx-auto w-full max-w-4xl px-4 touch-none" id="stage-area">
            
            <!-- Machine Container -->
            <div class="relative w-full h-48 sm:h-64 mt-auto">
                
                <!-- Fulcrum Target Area (Draggable) -->
                <!-- We separate the touch target from the visual so it's easier to grab -->
                <div id="fulcrum-touch-target" class="absolute bottom-0 w-24 h-24 z-30 cursor-grab flex justify-center items-end" style="left: 50%; transform: translateX(-50%);">
                    <!-- Visual Fulcrum (Triangle) -->
                    <div class="w-0 h-0 border-l-[30px] border-l-transparent border-r-[30px] border-r-transparent border-b-[50px] border-b-yellow-400 drop-shadow-xl relative">
                        <!-- Triangle inner details -->
                        <div class="absolute top-[10px] -left-[10px] w-0 h-0 border-l-[10px] border-l-transparent border-r-[10px] border-r-transparent border-b-[15px] border-b-yellow-300"></div>
                        <div class="absolute top-[35px] -left-[4px] w-2 h-2 bg-yellow-600 rounded-full"></div>
                    </div>
                </div>

                <!-- The Beam Wrapper (Pivots from the exact center of the fulcrum tip) -->
                <!-- Set bottom to match the height of the fulcrum (50px) -->
                <div id="beam-wrapper" class="absolute bottom-[50px] w-full h-8 z-20" style="transform-origin: 50% 100%;">
                    <!-- Actual Beam Visual -->
                    <div id="beam-visual" class="w-full h-full rounded-md shadow-lg relative flex items-center border-b-4 border-black/20">
                        <!-- Notches Container -->
                        <div class="absolute w-full h-full flex justify-between px-[2px] items-end pb-1">
                            <!-- 11 Notches (0 to 10) injected via JS -->
                        </div>

                        <!-- Load Container (Left side usually) -->
                        <div id="load-container" class="absolute bottom-full mb-1 flex flex-col items-center justify-end" style="left: 10%; transform: translateX(-50%);">
                            <!-- Load Weight Visual injected via JS -->
                        </div>

                        <!-- Effort Container (Right side usually) -->
                        <div id="effort-container" class="absolute bottom-full mb-1 flex flex-col items-center justify-end" style="left: 90%; transform: translateX(-50%);">
                            <!-- Effort Visual injected via JS -->
                        </div>
                    </div>
                </div>
                
                <!-- Base Ground Line -->
                <div class="absolute bottom-0 w-full h-3 bg-black/20 rounded-full blur-[2px]"></div>
            </div>
        </div>

        <!-- Controls -->
        <div class="p-6 pb-10 flex justify-center bg-gradient-to-t from-black/20 to-transparent z-20">
            <button id="push-btn" class="btn-3d chunky-text text-3xl px-12 py-5 bg-red-500 text-white rounded-3xl border-b-[8px] border-red-700 shadow-2xl active:bg-red-400 tracking-wider">
                PUSH!
            </button>
        </div>

        <!-- Overlays / Modals -->
        <div id="modal-overlay" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
            <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl border-8 border-yellow-400 transform scale-95 transition-transform duration-300" id="modal-box">
                <h2 id="modal-title" class="text-4xl chunky-text mb-4 text-green-500">Success!</h2>
                <p id="modal-text" class="text-gray-600 font-bold text-lg mb-8">You found the perfect mechanical advantage!</p>
                <button id="modal-btn" class="btn-3d w-full chunky-text text-2xl py-4 bg-yellow-400 text-yellow-900 rounded-2xl border-b-[6px] border-yellow-600 shadow-lg">
                    Next Job 🚀
                </button>
            </div>
        </div>

    </div>

    <script>
        // --- 1. Level Data (JSON Architecture) ---
        const levelData = [
            {
                id: 1,
                themeName: "Scrapyard",
                bgClass: "bg-orange-800", // Darker background for contrast
                beamClass: "bg-gray-400",
                blockClass: "bg-gray-800", // Heavy iron blocks
                effortClass: "bg-yellow-400",
                goalTitle: "Job 1: Balance the Load",
                goalText: "Move the fulcrum (triangle) so the 4 blocks of scrap balance perfectly with your 4 blocks of push power.",
                goalType: "balance",
                loadWeight: 4,
                loadPos: 1,  // Notch 1
                effortPower: 4,
                effortPos: 9,  // Notch 9
                initialFulcrum: 2
            },
            {
                id: 2,
                themeName: "Crystal Mines",
                bgClass: "bg-indigo-950",
                beamClass: "bg-cyan-800",
                blockClass: "bg-fuchsia-500", // Glowing crystals
                effortClass: "bg-emerald-400",
                goalTitle: "Job 2: Lift the Crystal",
                goalText: "You only have 2 blocks of push power. Can you figure out how to lift the 8-block crystal? Tip: Distance gives you strength!",
                goalType: "lift",
                loadWeight: 8,
                loadPos: 1,
                effortPower: 2,
                effortPos: 9,
                initialFulcrum: 6
            }
        ];

        // --- 2. State Variables ---
        let currentLevelIndex = 0;
        let fulcrumPos = 5; // 0 to 10 (representing percentages 0% to 100%)
        let isScientistMode = false;
        let isLocked = false; // Locks interaction during animation

        // --- 3. DOM Elements ---
        const appEl = document.getElementById('app');
        const themeNameEl = document.getElementById('theme-name');
        const goalTitleEl = document.getElementById('goal-title');
        const goalTextEl = document.getElementById('goal-text');
        
        const beamWrapper = document.getElementById('beam-wrapper');
        const beamVisual = document.getElementById('beam-visual');
        const fulcrumTouchTarget = document.getElementById('fulcrum-touch-target');
        const loadContainer = document.getElementById('load-container');
        const effortContainer = document.getElementById('effort-container');
        
        const pushBtn = document.getElementById('push-btn');
        const toggleScientistBtn = document.getElementById('toggle-scientist');
        const toggleKnob = document.getElementById('toggle-knob');
        const scientistPanel = document.getElementById('scientist-panel');
        
        // Modal elements
        const modalOverlay = document.getElementById('modal-overlay');
        const modalBox = document.getElementById('modal-box');
        const modalTitle = document.getElementById('modal-title');
        const modalText = document.getElementById('modal-text');
        const modalBtn = document.getElementById('modal-btn');

        // --- 4. Initialization and Rendering ---
        function initApp() {
            setupEventListeners();
            loadLevel(0);
        }

        function loadLevel(index) {
            if(index >= levelData.length) {
                // Game Completed State
                showModal("Game Complete!", "You finished all the jobs!", "Play Again", () => loadLevel(0));
                return;
            }

            currentLevelIndex = index;
            const level = levelData[currentLevelIndex];
            
            // Reset state
            isLocked = false;
            fulcrumPos = level.initialFulcrum;
            beamWrapper.style.transform = `rotate(0deg)`;

            // Apply Theme UI
            appEl.className = `flex-1 flex flex-col relative transition-colors duration-500 ${level.bgClass}`;
            themeNameEl.textContent = level.themeName;
            goalTitleEl.textContent = level.goalTitle;
            goalTextEl.textContent = level.goalText;
            
            // Render Beam styling
            beamVisual.className = `w-full h-full rounded-md shadow-lg relative flex items-center border-b-4 border-black/30 ${level.beamClass}`;
            
            // Draw Notches (11 notches: 0 to 10)
            const notchesHTML = Array.from({length: 11}).map((_, i) => 
                `<div class="w-1 h-3 bg-black/40 rounded-t-sm" style="opacity: ${i === 0 || i === 10 ? '0' : '1'}"></div>`
            ).join('');
            beamVisual.querySelector('div').innerHTML = notchesHTML;

            // Render Load and Effort blocks visually
            renderBlocks(loadContainer, level.loadWeight, level.blockClass, level.loadPos);
            renderBlocks(effortContainer, level.effortPower, level.effortClass, level.effortPos, true);

            // Set Initial rule text for Scientist Mode
            document.getElementById('math-rule-word').textContent = level.goalType === 'balance' ? 'Equal to' : 'Greater than';

            updatePhysics();
        }

        function renderBlocks(container, count, colorClass, positionPercent, isEffort = false) {
            container.style.left = `${positionPercent * 10}%`;
            
            let blocksHTML = `<div class="grid grid-cols-2 gap-[2px] mb-2 drop-shadow-md">`;
            for(let i=0; i<count; i++) {
                blocksHTML += `<div class="w-6 h-6 rounded-sm ${colorClass} border-2 border-black/20 flex items-center justify-center shadow-inner"></div>`;
            }
            blocksHTML += `</div>`;
            
            // Add the arrow/label underneath
            if(isEffort) {
                blocksHTML += `<div class="w-12 h-6 bg-green-500 rounded-md text-white text-xs font-bold flex items-center justify-center stripes border-2 border-white shadow-md animate-pulse">YOU</div>`;
            } else {
                blocksHTML += `<div class="text-xs font-bold text-white bg-black/50 px-2 rounded-full backdrop-blur-sm shadow-sm">LOAD</div>`;
            }

            container.innerHTML = blocksHTML;
        }

        // --- 5. Core Physics & Drag Logic ---
        function updatePhysics() {
            const level = levelData[currentLevelIndex];
            
            // 1. Update Fulcrum UI Position
            fulcrumTouchTarget.style.left = `${fulcrumPos * 10}%`;
            
            // 2. Set the Beam's pivot point perfectly to the top of the fulcrum
            beamWrapper.style.transformOrigin = `${fulcrumPos * 10}% 100%`;

            // 3. Calculate Math
            const loadDist = Math.abs(fulcrumPos - level.loadPos);
            const effortDist = Math.abs(fulcrumPos - level.effortPos);
            
            const loadTorque = level.loadWeight * loadDist;
            const effortTorque = level.effortPower * effortDist;

            // 4. Update Scientist Mode UI
            document.getElementById('math-load').innerHTML = `${level.loadWeight} <span class="text-gray-400 text-sm">blocks</span> × ${loadDist} <span class="text-gray-400 text-sm">dist</span> = <span class="text-white">${loadTorque}</span>`;
            document.getElementById('math-effort').innerHTML = `${level.effortPower} <span class="text-gray-400 text-sm">blocks</span> × ${effortDist} <span class="text-gray-400 text-sm">dist</span> = <span class="text-white">${effortTorque}</span>`;

            return { loadTorque, effortTorque };
        }

        function handlePush() {
            if(isLocked) return;
            isLocked = true; // Lock UI
            pushBtn.classList.add('opacity-50', 'pointer-events-none');
            pushBtn.textContent = "PUSHING...";

            const level = levelData[currentLevelIndex];
            const { loadTorque, effortTorque } = updatePhysics();
            
            let rotation = 0;
            let success = false;
            let feedbackTitle = "";
            let feedbackText = "";

            // Evaluate Win/Loss Conditions
            if (level.goalType === "balance") {
                if (loadTorque === effortTorque) {
                    rotation = 0; // Perfect balance
                    success = true;
                    feedbackTitle = "Perfect Balance! ⚖️";
                    feedbackText = "You found the exact middle point. Great job!";
                } else if (loadTorque > effortTorque) {
                    rotation = -12; // Load drops
                    feedbackTitle = "Too Heavy! 💥";
                    feedbackText = "The load side is pulling harder. Move the fulcrum closer to the load to make it easier.";
                } else {
                    rotation = 12; // Effort drops
                    feedbackTitle = "Too Much Power! 💥";
                    feedbackText = "You pushed too hard! Move the fulcrum further from the load.";
                }
            } 
            else if (level.goalType === "lift") {
                if (effortTorque >= loadTorque) {
                    rotation = 15; // Effort pushes down, load lifts up!
                    success = true;
                    feedbackTitle = "Heave Ho! 🚀";
                    feedbackText = `You lifted the heavy crystal using only ${level.effortPower} blocks of power! That is Mechanical Advantage!`;
                } else {
                    rotation = -15; // Failed to lift, load drops back down/stays down
                    feedbackTitle = "Not Strong Enough! 💦";
                    feedbackText = "You don't have enough torque. Try moving the fulcrum closer to the heavy load!";
                }
            }

            // Apply Animation
            beamWrapper.style.transform = `rotate(${rotation}deg)`;

            // Wait for animation, then show modal
            setTimeout(() => {
                if (success) {
                    showModal(feedbackTitle, feedbackText, "Next Job ➔", () => loadLevel(currentLevelIndex + 1));
                } else {
                    showModal(feedbackTitle, feedbackText, "Try Again ↺", () => {
                        // Reset beam
                        beamWrapper.style.transform = `rotate(0deg)`;
                        isLocked = false;
                        pushBtn.classList.remove('opacity-50', 'pointer-events-none');
                        pushBtn.textContent = "PUSH!";
                    });
                }
            }, 1000);
        }

        // --- 6. Interaction Handlers ---
        function setupEventListeners() {
            // Push Button
            pushBtn.addEventListener('click', handlePush);

            // Scientist Toggle
            toggleScientistBtn.addEventListener('click', () => {
                isScientistMode = !isScientistMode;
                if(isScientistMode) {
                    toggleScientistBtn.classList.replace('bg-gray-400', 'bg-green-500');
                    toggleKnob.style.transform = 'translateX(28px)';
                    scientistPanel.classList.remove('hidden');
                } else {
                    toggleScientistBtn.classList.replace('bg-green-500', 'bg-gray-400');
                    toggleKnob.style.transform = 'translateX(0px)';
                    scientistPanel.classList.add('hidden');
                }
            });

            // Dragging Logic for Fulcrum
            let isDragging = false;

            const startDrag = (e) => {
                if(isLocked) return;
                isDragging = true;
                e.preventDefault(); // Prevent scrolling on touch
            };

            const doDrag = (e) => {
                if(!isDragging || isLocked) return;
                e.preventDefault();
                
                // Unified touch/mouse coordinates
                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                
                // Get beam dimensions to calculate percentage
                const beamRect = beamVisual.getBoundingClientRect();
                let xPos = clientX - beamRect.left;
                
                // Convert to a 0-10 notch scale
                let ratio = xPos / beamRect.width;
                let notch = Math.round(ratio * 10);

                // Prevent placing fulcrum directly under or outside the blocks
                const level = levelData[currentLevelIndex];
                if(notch <= level.loadPos) notch = level.loadPos + 1;
                if(notch >= level.effortPos) notch = level.effortPos - 1;

                if (fulcrumPos !== notch) {
                    fulcrumPos = notch;
                    // Provide tiny haptic feedback if supported
                    if (navigator.vibrate) navigator.vibrate(10);
                    updatePhysics();
                }
            };

            const endDrag = () => {
                isDragging = false;
            };

            // Touch events
            fulcrumTouchTarget.addEventListener('touchstart', startDrag, {passive: false});
            document.addEventListener('touchmove', doDrag, {passive: false});
            document.addEventListener('touchend', endDrag);
            
            // Mouse events
            fulcrumTouchTarget.addEventListener('mousedown', startDrag);
            document.addEventListener('mousemove', doDrag);
            document.addEventListener('mouseup', endDrag);
        }

        // --- 7. Modal System ---
        function showModal(title, text, btnText, callback) {
            modalTitle.textContent = title;
            modalText.textContent = text;
            modalBtn.textContent = btnText;
            
            // Change colors based on success/fail
            if (title.includes("Perfect") || title.includes("Heave")) {
                modalTitle.className = "text-4xl chunky-text mb-4 text-green-500";
            } else {
                modalTitle.className = "text-4xl chunky-text mb-4 text-red-500";
            }

            modalOverlay.classList.remove('hidden');
            // Small delay to allow display:block to apply before animating opacity
            setTimeout(() => {
                modalOverlay.classList.remove('opacity-0');
                modalBox.classList.remove('scale-95');
            }, 10);

            // Handle button click once
            modalBtn.onclick = () => {
                modalOverlay.classList.add('opacity-0');
                modalBox.classList.add('scale-95');
                setTimeout(() => {
                    modalOverlay.classList.add('hidden');
                    callback();
                }, 300); // Wait for fade out
            };
        }

        // Boot the app
        window.onload = initApp;

    </script>
</body>
</html>
