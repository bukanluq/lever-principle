<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lever Physics Lab</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');

        :root {
            --primary: #4facfe;
            --secondary: #00f2fe;
            --accent: #ff0844;
            --accent2: #ffb199;
            --success: #38ef7d;
            --success-dark: #11998e;
            --bg-color: #f0f7fb;
            --text-dark: #2d3436;
            --panel-bg: #ffffff;
            --board-color: #f3a683;
            --fulcrum-color: #574b90;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Nunito', sans-serif;
            background: var(--bg-color);
            background-image: radial-gradient(#d1e5f0 2px, transparent 2px);
            background-size: 30px 30px;
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
            z-index: 10;
        }

        h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--primary);
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        .main-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 95vw;
            max-width: 1200px;
        }

        @media (min-width: 1024px) {
            .main-container {
                flex-direction: row;
                align-items: flex-start;
            }
        }

        /* Canvas Area */
        #game-container {
            position: relative;
            flex: 2;
            height: 50vh;
            min-height: 400px;
            background: var(--panel-bg);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            border: 4px solid white;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Dashboard & Controls */
        .controls-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 350px;
        }

        .dashboard {
            background: #2d3436;
            color: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            text-align: center;
        }

        .dash-item {
            display: flex;
            flex-direction: column;
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 12px;
        }

        .dash-item.full {
            grid-column: 1 / -1;
            background: var(--primary);
        }

        .dash-item.full.balanced {
            background: var(--success-dark);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(56, 239, 125, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(56, 239, 125, 0); }
            100% { box-shadow: 0 0 0 0 rgba(56, 239, 125, 0); }
        }

        .dash-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.8);
        }

        .dash-value {
            font-size: 1.5rem;
            font-weight: 900;
        }

        /* Sliders */
        .slider-group {
            background: var(--panel-bg);
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.05);
            border: 2px solid var(--bg-color);
        }

        .slider-group.blue { border-left: 6px solid var(--primary); }
        .slider-group.red { border-left: 6px solid var(--accent); }
        .slider-group.purple { border-left: 6px solid var(--fulcrum-color); }

        .slider-header {
            display: flex;
            justify-content: space-between;
            font-weight: 900;
            margin-bottom: 10px;
            color: var(--text-dark);
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 10px;
            border-radius: 5px;
            background: #dfe6e9;
            outline: none;
            margin: 10px 0;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--text-dark);
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .blue input[type="range"]::-webkit-slider-thumb { background: var(--primary); }
        .red input[type="range"]::-webkit-slider-thumb { background: var(--accent); }
        .purple input[type="range"]::-webkit-slider-thumb { background: var(--fulcrum-color); }

        /* Audio Overlay */
        #audio-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(45, 52, 54, 0.9);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            font-size: 2rem;
            font-weight: 900;
            cursor: pointer;
            transition: opacity 0.3s;
        }
    </style>
</head>
<body>

    <div id="audio-overlay">Tap anywhere to enter the Lab! 🎵</div>

    <header>
        <h1>Lever Physics Lab</h1>
    </header>

    <div class="main-container">
        <!-- Canvas -->
        <div id="game-container">
            <canvas id="gameCanvas"></canvas>
        </div>

        <!-- Dashboard & Controls -->
        <div class="controls-panel">
            
            <div class="dashboard">
                <div class="dash-item">
                    <span class="dash-label">Left Torque (CCW)</span>
                    <span class="dash-value" id="val-tq-left">0 N·m</span>
                </div>
                <div class="dash-item">
                    <span class="dash-label">Right Torque (CW)</span>
                    <span class="dash-value" id="val-tq-right">0 N·m</span>
                </div>
                <div class="dash-item full" id="status-panel">
                    <span class="dash-label">System Status</span>
                    <span class="dash-value" id="val-status">Tipping Right!</span>
                </div>
            </div>

            <div class="slider-group purple">
                <div class="slider-header">
                    <span>📐 Fulcrum Position</span>
                    <span id="lbl-fulcrum">5.0 m</span>
                </div>
                <input type="range" id="sl-fulcrum" min="1" max="9" step="0.1" value="5">
            </div>

            <div class="slider-group blue">
                <div class="slider-header">
                    <span>🟦 Blue Box Mass (Load)</span>
                    <span id="lbl-m1">10 kg</span>
                </div>
                <input type="range" id="sl-m1" min="1" max="100" step="1" value="10">
                
                <div class="slider-header" style="margin-top: 10px;">
                    <span>📍 Position on Board</span>
                    <span id="lbl-p1">2.0 m</span>
                </div>
                <input type="range" id="sl-p1" min="0" max="10" step="0.1" value="2">
            </div>

            <div class="slider-group red">
                <div class="slider-header">
                    <span>🟥 Red Box Mass (Force)</span>
                    <span id="lbl-m2">20 kg</span>
                </div>
                <input type="range" id="sl-m2" min="1" max="100" step="1" value="20">
                
                <div class="slider-header" style="margin-top: 10px;">
                    <span>📍 Position on Board</span>
                    <span id="lbl-p2">8.0 m</span>
                </div>
                <input type="range" id="sl-p2" min="0" max="10" step="0.1" value="8">
            </div>

        </div>
    </div>

    <script>
        // --- AUDIO ENGINE (Web Audio API) ---
        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playTone(freq, type, duration, vol = 0.1) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playThud() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        function playSuccess() {
            setTimeout(() => playTone(440, 'triangle', 0.2, 0.1), 0);
            setTimeout(() => playTone(554, 'triangle', 0.2, 0.1), 100);
            setTimeout(() => playTone(659, 'triangle', 0.4, 0.1), 200);
            setTimeout(() => playTone(880, 'sine', 0.6, 0.1), 300);
        }

        document.getElementById('audio-overlay').addEventListener('click', function() {
            initAudio();
            this.style.opacity = '0';
            setTimeout(() => this.style.display = 'none', 300);
        });

        // --- CANVAS SETUP ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('game-container');
        
        let width, height;
        let ppx = 60; // Pixels per meter

        function resize() {
            const rect = container.getBoundingClientRect();
            width = rect.width;
            height = rect.height;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            
            // Adjust scaling so the 10m board fits nicely
            ppx = (width * 0.8) / 10; 
        }
        window.addEventListener('resize', resize);

        // --- UI BINDINGS ---
        const ui = {
            fulcrum: document.getElementById('sl-fulcrum'),
            m1: document.getElementById('sl-m1'), p1: document.getElementById('sl-p1'),
            m2: document.getElementById('sl-m2'), p2: document.getElementById('sl-p2'),
            lblF: document.getElementById('lbl-fulcrum'),
            lblM1: document.getElementById('lbl-m1'), lblP1: document.getElementById('lbl-p1'),
            lblM2: document.getElementById('lbl-m2'), lblP2: document.getElementById('lbl-p2'),
            tqLeft: document.getElementById('val-tq-left'),
            tqRight: document.getElementById('val-tq-right'),
            statusText: document.getElementById('val-status'),
            statusPanel: document.getElementById('status-panel')
        };

        function updateUI() {
            ui.lblF.innerText = parseFloat(ui.fulcrum.value).toFixed(1) + ' m';
            ui.lblM1.innerText = ui.m1.value + ' kg';
            ui.lblP1.innerText = parseFloat(ui.p1.value).toFixed(1) + ' m';
            ui.lblM2.innerText = ui.m2.value + ' kg';
            ui.lblP2.innerText = parseFloat(ui.p2.value).toFixed(1) + ' m';
        }

        [ui.fulcrum, ui.m1, ui.p1, ui.m2, ui.p2].forEach(el => {
            el.addEventListener('input', () => {
                updateUI();
                // Awaken physics if sleeping
                if (Math.abs(physics.omega) < 0.001) physics.omega += (Math.random() > 0.5 ? 0.01 : -0.01); 
            });
        });

        // --- PHYSICS ENGINE ---
        const physics = {
            angle: 0,          // Radians
            omega: 0,          // Angular velocity
            gravity: 9.81,     // m/s^2
            boardLength: 10,   // meters
            boardMass: 5,      // kg (helps stabilize the simulation)
            wasBalanced: false
        };

        function calculatePhysics(dt) {
            let fPos = parseFloat(ui.fulcrum.value);
            let m1 = parseFloat(ui.m1.value);
            let p1 = parseFloat(ui.p1.value);
            let m2 = parseFloat(ui.m2.value);
            let p2 = parseFloat(ui.p2.value);

            // Torque = Force * Distance. CCW is positive, CW is negative.
            // Distance from fulcrum (left is positive direction for CCW torque)
            let d1 = fPos - p1;
            let d2 = fPos - p2;
            let dBoard = fPos - (physics.boardLength / 2);

            let tq1 = (m1 * physics.gravity) * d1;
            let tq2 = (m2 * physics.gravity) * d2;
            let tqBoard = (physics.boardMass * physics.gravity) * dBoard;

            let netTorque = tq1 + tq2 + tqBoard;

            // Moment of Inertia (I = m*r^2)
            let i1 = m1 * (d1 * d1);
            let i2 = m2 * (d2 * d2);
            // Board inertia parallel axis theorem: I_center = (m*L^2)/12 + m*d^2
            let iBoard = (physics.boardMass * Math.pow(physics.boardLength, 2)) / 12 + physics.boardMass * (dBoard * dBoard);
            
            let totalI = i1 + i2 + iBoard;
            if (totalI < 1) totalI = 1; // Prevent zero division

            // Angular Acceleration
            let alpha = netTorque / totalI;

            // Update velocity and position
            physics.omega += alpha * dt;
            physics.omega *= 0.96; // Damping (Friction)
            physics.angle += physics.omega;

            // Ground Collision Constraints
            // Find max angle based on board hitting ground. Ground is flat.
            // Distance from fulcrum to edge determines max angle.
            let h = 80 / ppx; // Height of fulcrum in meters
            let distLeft = fPos;
            let distRight = physics.boardLength - fPos;
            
            let maxAngleCW = -Math.asin(h / distRight);
            let maxAngleCCW = Math.asin(h / distLeft);

            // Cap the angles slightly earlier to simulate box height hitting
            maxAngleCW *= 0.9;
            maxAngleCCW *= 0.9;

            let hit = false;
            if (physics.angle < maxAngleCW) {
                physics.angle = maxAngleCW;
                if (physics.omega < -0.05) { playThud(); hit = true; }
                physics.omega = 0;
            } else if (physics.angle > maxAngleCCW) {
                physics.angle = maxAngleCCW;
                if (physics.omega > 0.05) { playThud(); hit = true; }
                physics.omega = 0;
            }

            // --- Dashboard Updates ---
            // Sum all positive torques (CCW) and negative torques (CW) for display
            let tqLeftDisplay = (tq1 > 0 ? tq1 : 0) + (tq2 > 0 ? tq2 : 0) + (tqBoard > 0 ? tqBoard : 0);
            let tqRightDisplay = Math.abs((tq1 < 0 ? tq1 : 0) + (tq2 < 0 ? tq2 : 0) + (tqBoard < 0 ? tqBoard : 0));

            ui.tqLeft.innerText = tqLeftDisplay.toFixed(1) + ' N·m';
            ui.tqRight.innerText = tqRightDisplay.toFixed(1) + ' N·m';

            let isBalanced = Math.abs(netTorque) < 1.0 && Math.abs(physics.omega) < 0.005 && Math.abs(physics.angle) < 0.1;

            if (isBalanced) {
                ui.statusText.innerText = "⚖️ PERFECTLY BALANCED!";
                ui.statusPanel.classList.add('balanced');
                if (!physics.wasBalanced) {
                    playSuccess();
                    physics.wasBalanced = true;
                }
            } else {
                ui.statusPanel.classList.remove('balanced');
                physics.wasBalanced = false;
                if (physics.angle > 0.05) ui.statusText.innerText = "Tipping Left ↙️";
                else if (physics.angle < -0.05) ui.statusText.innerText = "Tipping Right ↘️";
                else ui.statusText.innerText = "Stabilizing...";
            }
        }

        // --- RENDERING ---
        function drawFrame() {
            ctx.clearRect(0, 0, width, height);

            let cx = width / 2;
            let cy = height * 0.7; // Ground level

            // 1. Draw Ground
            ctx.fillStyle = '#dfe6e9';
            ctx.fillRect(0, cy, width, height - cy);
            ctx.strokeStyle = '#b2bec3';
            ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(width, cy); ctx.stroke();

            // Setup transforms for zooming based on ppx
            let fPos = parseFloat(ui.fulcrum.value);
            
            // 2. Draw Fulcrum
            let fulcrumWidth = 60;
            let fulcrumHeight = 80;
            
            ctx.save();
            ctx.translate(cx, cy);
            
            ctx.beginPath();
            ctx.moveTo(0, -fulcrumHeight);
            ctx.lineTo(-fulcrumWidth/2, 0);
            ctx.lineTo(fulcrumWidth/2, 0);
            ctx.closePath();
            ctx.fillStyle = 'var(--fulcrum-color)';
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#303952';
            ctx.stroke();

            // 3. Draw Board
            ctx.translate(0, -fulcrumHeight); // Pivot point
            ctx.rotate(-physics.angle); // -angle because canvas y is inverted

            let boardW = physics.boardLength * ppx;
            let boardH = 16;
            let boardLeftEdge = -fPos * ppx;

            ctx.fillStyle = 'var(--board-color)';
            ctx.beginPath();
            ctx.roundRect(boardLeftEdge, -boardH/2, boardW, boardH, 8);
            ctx.fill();
            ctx.strokeStyle = '#c44569';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Draw meter markings on board
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.font = 'bold 12px Nunito';
            ctx.textAlign = 'center';
            for(let i=0; i<=10; i++) {
                let mx = boardLeftEdge + (i * ppx);
                ctx.fillRect(mx - 1, -boardH/2, 2, boardH/2);
                ctx.fillText(i, mx, boardH/2 + 14);
            }

            // 4. Draw Weights
            let m1 = parseFloat(ui.m1.value);
            let p1 = parseFloat(ui.p1.value);
            let m2 = parseFloat(ui.m2.value);
            let p2 = parseFloat(ui.p2.value);

            function drawBox(mass, pos, colorBase, label) {
                // Size scales slightly with mass (sqrt to mimic volume)
                let size = 30 + Math.sqrt(mass) * 4;
                let boxX = boardLeftEdge + (pos * ppx);
                
                ctx.save();
                ctx.translate(boxX, -boardH/2);
                
                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.beginPath(); ctx.ellipse(0, 0, size/2, 4, 0, 0, Math.PI*2); ctx.fill();

                // Box
                ctx.fillStyle = colorBase;
                ctx.beginPath(); ctx.roundRect(-size/2, -size, size, size, 8); ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.2)';
                ctx.lineWidth = 3; ctx.stroke();

                // Label
                ctx.fillStyle = 'white';
                ctx.font = 'bold 14px Nunito';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(mass + 'kg', 0, -size/2);
                ctx.restore();
            }

            drawBox(m1, p1, 'var(--primary)', 'Blue');
            drawBox(m2, p2, 'var(--accent)', 'Red');

            // Draw Pivot Pin
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#2d3436'; ctx.stroke();

            ctx.restore();
        }

        // --- GAME LOOP ---
        let lastTime = 0;
        function loop(timestamp) {
            let dt = (timestamp - lastTime) / 1000;
            if (dt > 0.05) dt = 0.016; // Prevent massive jumps if tab was inactive
            lastTime = timestamp;

            calculatePhysics(dt);
            drawFrame();
            
            requestAnimationFrame(loop);
        }

        // Initialize
        resize();
        updateUI();
        requestAnimationFrame(loop);

    </script>
</body>
</html>
